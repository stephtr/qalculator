name: Build calculator

on:
    workflow_dispatch:
    push:
        branches: [main]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: cachix/install-nix-action@v31
            - run: nix build -L
            - uses: actions/upload-artifact@v4
              with:
                  name: calculator
                  path: result/*
